map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index privacy-policy.html;
  client_max_body_size 100m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location = /favicon.ico {
    default_type image/png;
    try_files /branding/favicon.png =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /favicon.png {
    try_files /branding/favicon.png =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /favicon.svg {
    default_type image/svg+xml;
    try_files /branding/favicon.svg =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /tiktokue6AnjOZKCYFEu1KyerrdZASM9Gtd8mF.txt {
    default_type text/plain;
    try_files /tiktokue6AnjOZKCYFEu1KyerrdZASM9Gtd8mF.txt =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /launches/tiktokue6AnjOZKCYFEu1KyerrdZASM9Gtd8mF.txt {
    default_type text/plain;
    try_files /tiktokue6AnjOZKCYFEu1KyerrdZASM9Gtd8mF.txt =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location /branding/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /uploads/ {
    alias /uploads/;
    try_files $uri =404;
  }

  location = /privacy {
    try_files /privacy-policy.html =404;
  }

  location = /privacy/ {
    return 301 /privacy;
  }

  location = /privacy-policy {
    try_files /privacy-policy.html =404;
  }

  location = /privacy-policy/ {
    return 301 /privacy-policy;
  }

  location = /privacy-policy.html {
    try_files /privacy-policy.html =404;
  }

  location = /privacypolicy {
    try_files /privacy-policy.html =404;
  }

  location = /privacypolicy/ {
    return 301 /privacypolicy;
  }

  location = /data-deletion {
    try_files /data-deletion.html =404;
  }

  location = /data-deletion/ {
    return 301 /data-deletion;
  }

  location = /data-deletion.html {
    try_files /data-deletion.html =404;
  }

  location = /delete-data {
    return 301 /data-deletion;
  }

  location = /delete-data/ {
    return 301 /data-deletion;
  }

  location = /terms {
    try_files /terms-of-service.html =404;
  }

  location = /terms/ {
    return 301 /terms;
  }

  location = /tos {
    return 301 /terms;
  }

  location = /tos/ {
    return 301 /terms;
  }

  location = /termsofservice {
    try_files /terms-of-service.html =404;
  }

  location = /termsofservice/ {
    return 301 /termsofservice;
  }

  location = /terms-of-service {
    try_files /terms-of-service.html =404;
  }

  location = /terms-of-service/ {
    return 301 /terms-of-service;
  }

  location = /terms-of-service.html {
    try_files /terms-of-service.html =404;
  }

  location = /api {
    return 308 https://$host/api/;
  }

  location /api/ {
    proxy_pass http://postiz:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location = /.well-known/oauth-protected-resource {
    proxy_pass http://postiz:3000/.well-known/oauth-protected-resource;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://postiz:3000/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location = /.well-known/openai-apps-challenge {
    proxy_pass http://postiz:3000/.well-known/openai-apps-challenge;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location = /mcp {
    proxy_pass http://postiz:3000/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location /mcp/ {
    proxy_pass http://postiz:3000/mcp/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location = /mcp-oauth {
    proxy_pass http://postiz:3000/mcp-oauth;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location /mcp-oauth/ {
    proxy_pass http://postiz:3000/mcp-oauth/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location /sse/ {
    proxy_pass http://postiz:3000/sse/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location /message/ {
    proxy_pass http://postiz:3000/message/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }

  location / {
    # Let Postiz handle "/" normally. Proxying only the exact root request to
    # "/auth" causes authenticated users to bounce from "/" back to "/" forever.
    proxy_pass http://postiz:5000;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
    sub_filter_once off;
    sub_filter 'https://postiz.com/privacy' 'https://everywhereposter.com/privacy';
    sub_filter 'https://postiz.com/terms' 'https://everywhereposter.com/terms';
    sub_filter '<head>' '<head><link rel="icon" type="image/png" href="/branding/favicon.png"><link rel="canonical" href="https://$host$request_uri"><meta property="og:title" content="EverywherePoster"><meta property="og:description" content="EverywherePoster helps creators, founders, businesses, and teams create, schedule, and publish content across multiple platforms from one place."><meta property="og:type" content="website"><meta property="og:url" content="https://$host$request_uri"><meta property="og:image" content="https://app.everywhereposter.com/branding/pe-logo.png"><meta property="og:image:width" content="2000"><meta property="og:image:height" content="2000"><meta property="og:image:alt" content="EverywherePoster logo"><meta property="fb:app_id" content="1311595390867645"><script src="/branding/branding.js?v=20260510a" defer></script>';
  }
}
