map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index privacy-policy.html;
  client_max_body_size 100m;

  location = /favicon.ico {
    default_type image/png;
    try_files /branding/favicon.png =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /favicon.png {
    try_files /branding/favicon.png =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /favicon.svg {
    default_type image/svg+xml;
    try_files /branding/favicon.svg =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /branding/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /privacy {
    try_files /privacy-policy.html =404;
  }

  location = /privacy/ {
    return 301 /privacy;
  }

  location = /privacy-policy {
    try_files /privacy-policy.html =404;
  }

  location = /privacy-policy/ {
    return 301 /privacy-policy;
  }

  location = /privacy-policy.html {
    try_files /privacy-policy.html =404;
  }

  location = /privacypolicy {
    try_files /privacy-policy.html =404;
  }

  location = /privacypolicy/ {
    return 301 /privacypolicy;
  }

  location = /terms {
    try_files /terms-of-service.html =404;
  }

  location = /terms/ {
    return 301 /terms;
  }

  location = /tos {
    return 301 /terms;
  }

  location = /tos/ {
    return 301 /terms;
  }

  location = /termsofservice {
    try_files /terms-of-service.html =404;
  }

  location = /termsofservice/ {
    return 301 /termsofservice;
  }

  location = /terms-of-service {
    try_files /terms-of-service.html =404;
  }

  location = /terms-of-service/ {
    return 301 /terms-of-service;
  }

  location = /terms-of-service.html {
    try_files /terms-of-service.html =404;
  }

  location / {
    proxy_pass http://postiz:5000;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    sub_filter_once off;
    sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/branding/favicon.svg"><script src="/branding/branding.js?v=20260402f" defer></script></head>';
  }
}
