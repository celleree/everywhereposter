name: Prepare offline worker verification metadata

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed current main SHA (40 lowercase hex characters)
        required: true
        type: string
      node_base:
        description: Reviewed official Node or ghcr.io/celleree image digest (no tag)
        required: true
        type: string
      cooked_base:
        description: Reviewed ghcr.io/celleree Python/model image digest (no tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      NODE_BASE: ${{ inputs.node_base }}
      COOKED_BASE: ${{ inputs.cooked_base }}
      CONTEXT: ${{ runner.temp }}/cooked-context
      METADATA: ${{ runner.temp }}/cooked-metadata
    steps:
      - name: Require exact canonical main and merged-PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == celleree/everywhereposter && "$DEFAULT_BRANCH" == main ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          namespace='ghcr\.io/celleree/[a-z0-9]+([._-][a-z0-9]+)*'
          [[ "$NODE_BASE" =~ ^(node|docker\.io/library/node|${namespace})@sha256:[0-9a-f]{64}$ ]]
          [[ "$COOKED_BASE" =~ ^${namespace}@sha256:[0-9a-f]{64}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$SOURCE_SHA" ]]
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .base.repo.full_name == "celleree/everywhereposter" and .merge_commit_sha == env.SOURCE_SHA)] | length')"
          [[ "$count" -ge 1 ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify canonical branch safeguards
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-canonical-branch.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install existing locked repository dependencies
        working-directory: postiz-app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test and stage exact runtime closure
        run: |
          set -eu
          node --test tools/cooked-worker/stage-runtime.test.cjs
          node tools/cooked-worker/stage-runtime.cjs "$SOURCE_SHA" "$CONTEXT"
          mkdir "$METADATA"
          cp "$CONTEXT/staging-manifest.json" "$METADATA/"
          python3 - <<'PY'
          import ast, json, os, runpy
          from pathlib import Path
          recipe = Path('tools/cooked-pilot/prepare.py')
          policy = runpy.run_path(str(recipe))
          revisions = [v.value for n in ast.walk(ast.parse(recipe.read_text())) if isinstance(n, ast.Dict) for k, v in zip(n.keys, n.values) if isinstance(k, ast.Constant) and k.value == 'modelRepositoryRevision' and isinstance(v, ast.Constant)]
          assert len(revisions) == 1
          staged = json.loads((Path(os.environ['CONTEXT']) / 'staging-manifest.json').read_text())
          expected = dict(upstream=policy['PIN'], modelFiles=policy['MODEL'], modelRepositoryRevision=revisions[0], runtimeHashes=staged['runtimeHashes'])
          (Path(os.environ['METADATA']) / 'expected-policy.json').write_text(json.dumps(expected, sort_keys=True))
          PY

      - name: Build locally on runner without publication
        run: |
          set -eu
          docker build --pull --platform linux/amd64 --build-arg NODE_BASE="$NODE_BASE" --build-arg COOKED_BASE="$COOKED_BASE" --tag cooked-preparation:verified "$CONTEXT"
          docker image inspect cooked-preparation:verified --format '{{json .}}' | python3 -c 'import json,os,sys; i=json.load(sys.stdin); assert (i["Os"],i["Architecture"],i["Config"]["User"]) == ("linux","amd64","10001:0"); print(json.dumps(dict(imageId=i["Id"],platform="linux/amd64",user=i["Config"]["User"],nodeBase=os.environ["NODE_BASE"],cookedBase=os.environ["COOKED_BASE"],sourceSHA=os.environ["SOURCE_SHA"]),indent=2))' > "$METADATA/image.json"

      - name: Verify image bytes, source/model pins and retained notices offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --pids-limit 32 --entrypoint python -i cooked-preparation:verified -I - "$(cat "$METADATA/expected-policy.json")" > "$METADATA/image-verification.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          expected = json.loads(sys.argv[1])
          assert (os.getuid(), os.getgid()) == (10001, 0)
          def checked(root, entries):
              result = {}
              for name, want in entries.items():
                  assert isinstance(name, str) and name and not Path(name).is_absolute() and '..' not in Path(name).parts
                  p = root / name
                  assert not p.is_symlink() and p.resolve().is_relative_to(root) and p.is_file()
                  actual = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
                  assert actual == want, name
                  result[name] = actual
              return result
          runtime = Path('/opt/runtime')
          assert sorted(p.name for p in runtime.iterdir()) == sorted(expected['runtimeHashes'])
          runtime_hashes = checked(runtime, expected['runtimeHashes'])
          manifest_path = Path('/opt/source-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          for key in ('upstream', 'modelRepositoryRevision', 'modelFiles'):
              assert manifest[key] == expected[key], key
          assert manifest['sourceFiles'] and 'LICENSE' in manifest['sourceFiles']
          source_hashes = checked(Path('/opt/upstream'), manifest['sourceFiles'])
          model_hashes = checked(Path('/opt/model'), expected['modelFiles'])
          notices = ['/opt/upstream/LICENSE', '/opt/MODEL-NOTICES.md', '/opt/NODE-LICENSE', '/usr/local/lib/python3.12/LICENSE.txt', '/usr/share/doc/ffmpeg/copyright']
          notice_hashes = {name: hashlib.file_digest(Path(name).open('rb'), 'sha256').hexdigest() for name in notices}
          print(json.dumps(dict(runtimeHashes=runtime_hashes, upstream=manifest['upstream'], modelRepositoryRevision=manifest['modelRepositoryRevision'], sourceFiles=source_hashes, modelFiles=model_hashes, sourceManifestSHA256=hashlib.sha256(manifest_path.read_bytes()).hexdigest(), noticeHashes=notice_hashes), indent=2))
          PY

      - name: Retain verification metadata only
        uses: actions/upload-artifact@v4
        with:
          name: cooked-preparation-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/cooked-metadata/*.json
          if-no-files-found: error
          retention-days: 30
