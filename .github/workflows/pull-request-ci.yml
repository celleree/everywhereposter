name: Pull request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full base commit SHA to compare
        required: true
        type: string
      head_sha:
        description: Full head commit SHA to test
        required: true
        type: string

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  resolve-revisions:
    name: Resolve trusted revisions
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.revisions.outputs.base_sha }}
      head_sha: ${{ steps.revisions.outputs.head_sha }}
      checkout_ref: ${{ steps.revisions.outputs.checkout_ref }}

    steps:
      - name: Validate repository commit identities
        id: revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$EVENT_SHA" = "$HEAD_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$BASE_SHA" --jq .sha)" = "$BASE_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .sha)" = "$HEAD_SHA"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

  repository-guard:
    name: Repository guard
    needs: resolve-revisions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.checkout_ref }}

      - name: Verify canonical branch safeguards
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-canonical-branch.sh

      - name: Test agent repository and credential guards
        run: |
          bash scripts/agents/test-codex-task.sh
          bash scripts/agents/test-codex-issue-queue.sh

  quality:
    name: Type checks and stable unit tests
    needs: resolve-revisions
    runs-on: ubuntu-latest
    services:
      publication-fixtures:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: isolated
          POSTGRES_PASSWORD: isolated
          POSTGRES_DB: isolated
        ports:
          - 55462:5432
        options: >-
          --health-cmd "pg_isready -U isolated -d isolated"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ACCEPTANCE_BASE_SHA: ${{ needs.resolve-revisions.outputs.base_sha }}
      ACCEPTANCE_HEAD_SHA: ${{ needs.resolve-revisions.outputs.head_sha }}
      ACCEPTANCE_CHECKOUT_SHA: ${{ needs.resolve-revisions.outputs.checkout_ref }}
    defaults:
      run:
        working-directory: postiz-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify working tree and pull request diff
        id: candidate-diff
        working-directory: .
        env:
          BASE_SHA: ${{ needs.resolve-revisions.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-revisions.outputs.head_sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git status --short
          test "$(git rev-parse HEAD)" = "$HEAD_SHA" || test "${{ github.event_name }}" = "pull_request"
          git diff --check "$BASE_SHA...$HEAD_SHA"
          git diff --stat "$BASE_SHA...$HEAD_SHA"
          studio_paths="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- tools/video-studio/13_editing_pipeline/v1 .github/workflows/pull-request-ci.yml)"
          if [ -n "$studio_paths" ]; then
            echo 'studio_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'studio_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: postiz-app/pnpm-lock.yaml

      - name: Test production readiness checks
        working-directory: .
        run: |
          python3 -B -m unittest discover -s tools/cooked-worker -p publication_test.py
          node --test scripts/test-check-postiz-readiness.mjs
          bash scripts/test-wait-for-container-health.sh
          bash scripts/test-wait-for-public-readiness.sh
          bash scripts/test-reload-public-proxy.sh
          sh scripts/test-backup-postgres.sh
          node --test scripts/cooked-pilot.test.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare billing acceptance guards and evidence
        shell: bash
        env:
          BILLING_FIXTURE_ID: ${{ job.services.publication-fixtures.id }}
        run: |
          [[ "$BILLING_FIXTURE_ID" =~ ^[0-9a-f]{64}$ ]]
          printf 'BILLING_FIXTURE_ID=%s\n' "$BILLING_FIXTURE_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/billing-acceptance"
          cat > "$RUNNER_TEMP/billing-acceptance/check.py" <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def migrations(root):
              files = sorted((root / "postiz-app/libraries/nestjs-libraries/src/database/prisma/migrations").glob("*/migration.sql"))
              require(len(files) == 19, "Expected exactly 19 candidate migrations")
              return {p.parent.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}

          def verify_service(data, expected):
              require(re.fullmatch(r"[0-9a-f]{64}", expected or ""), "Invalid job service identity")
              require(isinstance(data, list) and len(data) == 1, "Ambiguous service inspection")
              service = data[0]
              require(service["Id"] == expected, "Service does not match this job")
              require(service["State"]["Running"] and service["State"]["Health"]["Status"] == "healthy", "Service not healthy")
              require(service["Config"]["Image"] == "postgres:17-alpine", "Unexpected fixture image")
              env = dict(item.split("=", 1) for item in service["Config"]["Env"])
              for key, value in {"POSTGRES_USER": "isolated", "POSTGRES_PASSWORD": "isolated", "POSTGRES_DB": "isolated"}.items():
                  require(env.get(key) == value, "Unexpected synthetic fixture configuration")
              require(not env.get("POSTGRES_PASSWORD_FILE"), "File-backed credentials are prohibited")
              ports = service["NetworkSettings"]["Ports"].get("5432/tcp", [])
              require(ports and all(p["HostPort"] == "55462" and p["HostIp"] in ("0.0.0.0", "127.0.0.1", "::") for p in ports), "Unexpected fixture binding")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", service["Image"]), "Invalid fixture image identity")
              return {"container_id": expected, "created": service["Created"], "image_id": service["Image"]}

          def verify_migrations(text, expected):
              rows = [line.split("|") for line in text.splitlines() if line]
              require(len(rows) == 19 and all(len(row) == 3 for row in rows), "Missing or malformed migration evidence")
              require(len({row[0] for row in rows}) == 19, "Duplicate migration evidence")
              require({row[0]: row[1] for row in rows} == expected and all(row[2] == "t" for row in rows), "Migrations differ or did not finish")

          def verify_tap(text, expected):
              for key, count in {"tests": expected, "pass": expected, "fail": 0, "cancelled": 0, "skipped": 0, "todo": 0}.items():
                  require(re.findall(r"^# " + key + r" (\d+)\s*$", text, re.M) == [str(count)], "Invalid TAP " + key)
              require(re.findall(r"^ok ([1-9]\d*) - .+$", text, re.M) == [str(i) for i in range(1, expected + 1)], "Missing TAP case evidence")
              require(re.findall(r"^1\.\.(\d+)\s*$", text, re.M) == [str(expected)], "Invalid TAP plan")
              require(not re.search(r"^ok .*#\s*(SKIP|TODO)\b", text, re.M | re.I), "Skipped TAP case")
              require(not re.search(r"^not ok\b|^Bail out!", text, re.M), "TAP reports failure")

          def verify_unittest(text, expected):
              require(re.findall(r"^Ran (\d+) tests? in .+$", text, re.M) == [str(expected)], "Unexpected unittest count")
              require(text.rstrip().endswith("\nOK") and len(re.findall(r"^test_.* \.\.\. ok$", text, re.M)) == expected, "Unittest failure or skipped coverage")

          def verify_jest(data, group, wallet_names=None):
              require(isinstance(data, dict) and data.get("success") is True, "Missing or unsuccessful Jest result")
              results = data.get("testResults")
              require(isinstance(results, list) and results, "Missing Jest suite evidence")
              if group == "wallet":
                  for key, expected in {"numTotalTestSuites": 16, "numPassedTestSuites": 16, "numTotalTests": 368, "numPassedTests": 368, "numFailedTests": 0, "numPendingTests": 0, "numTodoTests": 0, "numPendingTestSuites": 0}.items():
                      require(data.get(key) == expected, "Invalid wallet " + key)
                  require(len(results) == 16 and len({r["name"] for r in results}) == 16, "Invalid wallet suite inventory")
                  require(wallet_names is not None and len(wallet_names) == 16 and {r["name"].replace("\\", "/") for r in results} == wallet_names, "Wallet suites differ from candidate")
                  require(sum(len(r.get("assertionResults", [])) for r in results) == 368, "Missing wallet assertion evidence")
                  selected = results
              else:
                  names = {
                      "frontend": ["ai-wallet", "copy-generation.client", "copy-generation.retry-identity", "composer.draft.recovery", "manage.modal.guided.publish"],
                      "published": ["publishing-submission", "publishing-submission.postgres"],
                      "copy": ["stripe.launch-plan", "stripe.launch-checkout.integration", "stripe.card-required-trial", "stripe.launch-billing-boundaries", "stripe.billing-activation", "stripe.entitlement-reconciliation", "stripe.lifetime-claim", "launch-ai-route-policies", "launch-mcp-entitlements", "launch.permissions", "media.controller.video-edit", "studio-editor.integration", "studio-storage", "studio-bridge", "studio-evidence", "studio-director", "refund-request.authorization", "stripe.refund-refusal", "oauth.redemption.integration", "oauth.refresh.integration"],
                  }[group]
                  directory, extension = {"frontend": ("frontend", "tsx"), "copy": ("copy-generation", "ts"), "published": ("published-posts", "ts")}[group]
                  selected = []
                  for name in names:
                      suffix = "/tests/" + directory + "/" + name + ".spec." + extension
                      found = [r for r in results if r.get("name", "").replace("\\", "/").endswith(suffix)]
                      require(len(found) == 1, "Missing or duplicate required suite: " + name)
                      selected.extend(found)
              for result in selected:
                  assertions = result.get("assertionResults")
                  require(result.get("status") == "passed" and isinstance(assertions, list) and assertions and all(a.get("status") == "passed" for a in assertions), "Required suite failed or skipped")
                  expected_count = {"launch.permissions.spec.ts": 17, "media.controller.video-edit.spec.ts": 24, "studio-editor.integration.spec.ts": 15, "studio-storage.spec.ts": 7, "studio-bridge.spec.ts": 30, "studio-evidence.spec.ts": 13, "studio-director.spec.ts": 9, "composer.draft.recovery.spec.tsx": 49, "manage.modal.guided.publish.spec.tsx": 42, "publishing-submission.spec.ts": 15, "publishing-submission.postgres.spec.ts": 36}.get(result["name"].replace("\\", "/").rsplit("/", 1)[-1])
                  if expected_count is not None:
                      require(len(assertions) == expected_count, "Unexpected local editor assertion count")

          def main():
              root, out = Path(os.environ["GITHUB_WORKSPACE"]), Path(os.environ["RUNNER_TEMP"]) / "billing-acceptance"
              mode, *args = sys.argv[1:]
              if mode == "identity":
                  def git(*arguments):
                      return subprocess.check_output(["git", "-C", str(root), *arguments], text=True).strip()
                  require(all(re.fullmatch(r"[0-9a-f]{40}", os.environ.get(key, "")) for key in ("ACCEPTANCE_BASE_SHA", "ACCEPTANCE_HEAD_SHA", "ACCEPTANCE_CHECKOUT_SHA")), "Invalid acceptance revisions")
                  actual = git("rev-parse", "HEAD")
                  require(actual == os.environ["ACCEPTANCE_CHECKOUT_SHA"], "Unexpected checkout")
                  receipt = {key: os.environ.get(key) for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME", "ACCEPTANCE_BASE_SHA", "ACCEPTANCE_HEAD_SHA", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion")}
                  receipt.update(checkout=actual, tree=git("rev-parse", "HEAD^{tree}"), head_tree=git("rev-parse", os.environ["ACCEPTANCE_HEAD_SHA"] + "^{tree}"), workflow_blob=git("rev-parse", "HEAD:.github/workflows/pull-request-ci.yml"))
                  (out / "identity.json").write_text(json.dumps(receipt, indent=2))
                  (out / "migrations.json").write_text(json.dumps(migrations(root), indent=2))
              elif mode == "service":
                  receipt = verify_service(json.load(sys.stdin), os.environ.get("BILLING_FIXTURE_ID"))
                  image = json.loads(subprocess.check_output(["docker", "image", "inspect", receipt["image_id"]], text=True))[0]
                  require(image["Id"] == receipt["image_id"], "Image identity changed")
                  receipt["repo_digests"] = image.get("RepoDigests", [])
                  (out / "service.json").write_text(json.dumps(receipt, indent=2))
              elif mode == "migrations":
                  verify_migrations(Path(args[0]).read_text(), migrations(root))
              elif mode == "tap":
                  verify_tap(Path(args[0]).read_text(), int(args[1]))
              elif mode == "unittest":
                  verify_unittest(Path(args[0]).read_text(), int(args[1]))
              elif mode == "jest":
                  names = {str(p).replace("\\", "/") for p in (root / "postiz-app/tests/ai-wallet").rglob("*.spec.ts")}
                  verify_jest(json.loads(Path(args[0]).read_text()), args[1], names)
              else:
                  raise ValueError("Unknown evidence mode")
              print("PASS billing acceptance evidence:", mode, *args)

          if __name__ == "__main__":
              main()
          PY
          cat > "$RUNNER_TEMP/billing-acceptance/fixture.sh" <<'SH'
          set -euo pipefail
          evidence="$RUNNER_TEMP/billing-acceptance"
          fixture_sql() {
            docker exec -e PGPASSWORD=isolated "$BILLING_FIXTURE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U isolated -d isolated "$@"
          }
          guard_fixture() {
            test -z "${DOCKER_HOST:-}"
            test "$(docker context show)" = default
            docker inspect --type container "$BILLING_FIXTURE_ID" | python3 "$evidence/check.py" service
            test "$(fixture_sql -Atc "SELECT current_user || '|' || current_database() || '|' || inet_server_port()")" = 'isolated|isolated|5432'
          }
          wallet_identity() {
            fixture_sql -Atc "SELECT oid || '|' || pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'ep_ai_wallet_test'"
          }
          create_wallet() {
            guard_fixture
            test "$DATABASE_URL" = 'postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test'
            test ! -e "$evidence/wallet-owner.txt"
            test "$(fixture_sql -Atc "SELECT count(*) FROM pg_database WHERE datname = 'ep_ai_wallet_test'")" = 0
            fixture_sql -c 'CREATE DATABASE ep_ai_wallet_test OWNER isolated'
            local identity
            identity="$(wallet_identity)"
            [[ "$identity" =~ ^[1-9][0-9]*\|isolated$ ]]
            printf '%s\n' "$BILLING_FIXTURE_ID|$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$identity" > "$evidence/wallet-owner.txt"
          }
          drop_wallet() {
            guard_fixture
            test "$DATABASE_URL" = 'postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test'
            test -f "$evidence/wallet-owner.txt"
            test "$(cat "$evidence/wallet-owner.txt")" = "$BILLING_FIXTURE_ID|$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$(wallet_identity)"
            fixture_sql -c 'DROP DATABASE ep_ai_wallet_test'
            rm -- "$evidence/wallet-owner.txt"
          }
          verify_migrations() {
            case "$1" in isolated|ep_ai_wallet_test) ;; *) return 1 ;; esac
            guard_fixture
            docker exec -e PGPASSWORD=isolated "$BILLING_FIXTURE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U isolated -d "$1" -Atc 'SELECT migration_name, checksum, (finished_at IS NOT NULL AND rolled_back_at IS NULL) FROM "_prisma_migrations" ORDER BY migration_name' > "$evidence/$2-migrations.txt"
            python3 "$evidence/check.py" migrations "$evidence/$2-migrations.txt"
          }
          SH
          python3 "$RUNNER_TEMP/billing-acceptance/check.py" identity

      - name: Test generated post-set review workflow
        id: post-set-test
        continue-on-error: true
        run: |
          pnpm exec jest --config jest.post-set-review.config.cjs --runInBand --json --outputFile="$RUNNER_TEMP/billing-acceptance/frontend.json" > post-set-test.log 2>&1
          python3 "$RUNNER_TEMP/billing-acceptance/check.py" jest "$RUNNER_TEMP/billing-acceptance/frontend.json" frontend

      - name: Enforce generated post-set review workflow
        if: steps.post-set-test.outcome == 'failure'
        run: |
          cat post-set-test.log
          exit 1

      - name: Prepare disposable publication fixture database
        env:
          DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/isolated
        run: |
          source "$RUNNER_TEMP/billing-acceptance/fixture.sh"
          guard_fixture
          test "$DATABASE_URL" = 'postgresql://isolated:isolated@127.0.0.1:55462/isolated'
          test "$(fixture_sql -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")" = 0
          pnpm exec prisma validate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          verify_migrations isolated publication

      - name: Test billing helper groups with separate fresh fixtures
        env:
          DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
          AI_WALLET_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
        run: |
          source "$RUNNER_TEMP/billing-acceptance/fixture.sh"
          test "$AI_WALLET_TEST_DATABASE_URL" = "$DATABASE_URL"
          for spec in acceptance-sandbox:8 acceptance-sandbox-resume:4 review-funded-test-refund:5; do
            name="${spec%:*}"
            count="${spec#*:}"
            create_wallet
            cp "$evidence/wallet-owner.txt" "$evidence/$name-owner.txt"
            pnpm exec prisma migrate deploy --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
            verify_migrations ep_ai_wallet_test "$name"
            (cd "$GITHUB_WORKSPACE" && node --test --test-reporter=tap "scripts/billing/$name.test.cjs") 2>&1 | tee "$evidence/$name.tap"
            python3 "$evidence/check.py" tap "$evidence/$name.tap" "$count"
            drop_wallet
          done

      - name: Test billing launcher safeguards
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/billing-acceptance"
          for spec in acceptance-sandbox-launcher:5 review-funded-test-refund-launcher:2; do
            name="${spec%:*}"
            count="${spec#*:}"
            python3 -B "$GITHUB_WORKSPACE/scripts/billing/$name.test.py" -v 2>&1 | tee "$evidence/$name.log"
            python3 "$evidence/check.py" unittest "$evidence/$name.log" "$count"
          done

      - name: Prepare isolated prepaid wallet database
        env:
          DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
        run: |
          source "$RUNNER_TEMP/billing-acceptance/fixture.sh"
          create_wallet
          pnpm exec prisma migrate deploy --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          verify_migrations ep_ai_wallet_test wallet

      - name: Test prepaid wallet transactions against PostgreSQL
        env:
          AI_WALLET_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
          LAUNCH_ENTITLEMENT_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/billing-acceptance"
          pnpm exec jest --config jest.ai-wallet.config.cjs --runInBand --json --outputFile="$evidence/wallet.json" 2>&1 | tee "$evidence/wallet.log"
          python3 "$evidence/check.py" jest "$evidence/wallet.json" wallet

      - name: Verify default Jest configuration loads
        run: |
          node -e "require('./jest.preset.js')"
          pnpm test --showConfig > /dev/null

      - name: Test default Jest entrypoint
        run: pnpm test --runInBand --runTestsByPath tests/sentry/initialize.sentry.spec.ts

      - name: Test packaged runtime service supervision
        working-directory: .
        run: node --test scripts/test-start-postiz.mjs

      - name: Install pinned Chromium and browser system dependencies
        run: |
          pnpm exec playwright install --with-deps chromium
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Run offline Chromium regression smoke
        env:
          EP_FACEBOOK_BROWSER: '1'
          EP_SUBMISSION_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/isolated
        run: pnpm run test:browser:ci

      - name: Test isolated prepaid wallet presentation
        env:
          EP_WALLET_BROWSER: '1'
        run: pnpm exec playwright test prepaid-wallet.spec.ts --project=phone-chromium

      - name: Run isolated Business Discovery Chromium regressions
        env:
          EP_DISCOVERY_BROWSER: '1'
          BROWSER_FRONTEND_PORT: '4417'
          BROWSER_API_PORT: '4418'
        run: pnpm exec playwright test tests/browser/business-discovery.spec.ts --project=phone-chromium --global-timeout=900000

      - name: Upload offline browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-browser-${{ github.run_id }}
          path: |
            postiz-app/browser-results
            postiz-app/browser-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify FFmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Verify Studio package on Linux with generated media
        if: steps.candidate-diff.outputs.studio_changed == 'true'
        timeout-minutes: 15
        working-directory: tools/video-studio/13_editing_pipeline/v1
        env:
          STUDIO_EVIDENCE: ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}
          STUDIO_VENV: ${{ runner.temp }}/studio-venv-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$STUDIO_EVIDENCE"
          mkdir -p "$STUDIO_EVIDENCE"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv --copies "$STUDIO_VENV"
          "$STUDIO_VENV/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee "$STUDIO_EVIDENCE/tests.tap"
          "$STUDIO_VENV/bin/python" - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['STUDIO_EVIDENCE']) / 'tests.tap').read_text()
          for name, value in {'tests': 87, 'pass': 87, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0}.items():
              assert re.findall(r'^# ' + name + r' (\d+)\s*$', text, re.M) == [str(value)], name
          print('PASS: all 87 Studio tests executed without skips')
          PY
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          import {execFileSync} from 'node:child_process';
          import {hash} from './runtime.mjs';
          const root = process.cwd(), out = process.env.STUDIO_EVIDENCE;
          const require = createRequire(path.join(process.env.GITHUB_WORKSPACE, 'postiz-app/package.json'));
          const font = ['/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf', '/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf'].find(file => fs.existsSync(file));
          if (!font) throw new Error('Linux Liberation Sans Bold font is required');
          const command = name => fs.realpathSync(execFileSync('which', [name], {encoding: 'utf8'}).trim());
          const runtime = {schemaVersion: 1, effectsV1Root: null, effectsV2Root: null,
            nodeModulesRoot: path.join(root, 'node_modules'), lockfilePath: path.join(root, 'package-lock.json'),
            nodeExecutable: process.execPath, pythonExecutable: path.join(process.env.STUDIO_VENV, 'bin/python'),
            pythonSitePackagesRoot: null, browserExecutable: require('@playwright/test').chromium.executablePath(),
            ffmpegExecutable: command('ffmpeg'), ffprobeExecutable: command('ffprobe')};
          for (const key of ['nodeExecutable', 'pythonExecutable', 'browserExecutable', 'ffmpegExecutable', 'ffprobeExecutable']) {
            if (!fs.statSync(runtime[key]).isFile()) throw new Error('Missing runtime executable: ' + key);
          }
          fs.writeFileSync(path.join(out, 'runtime.json'), JSON.stringify(runtime, null, 2));
          fs.writeFileSync(path.join(out, 'font-path.txt'), fs.realpathSync(font));
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          fs.writeFileSync(path.join(out, 'identity.json'), JSON.stringify({
            run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME, base: process.env.ACCEPTANCE_BASE_SHA,
            head: process.env.ACCEPTANCE_HEAD_SHA, checkout: git('rev-parse', 'HEAD'),
            tree: git('rev-parse', 'HEAD^{tree}'), packageTree: git('rev-parse', 'HEAD:tools/video-studio/13_editing_pipeline/v1'),
            workflowBlob: git('rev-parse', 'HEAD:.github/workflows/pull-request-ci.yml'),
            lockfileSha256: await hash(runtime.lockfilePath), fontSha256: await hash(font),
            node: process.version, platform: process.platform, architecture: process.arch,
            python: execFileSync(runtime.pythonExecutable, ['--version'], {encoding: 'utf8'}).trim(),
            ffmpeg: execFileSync(runtime.ffmpegExecutable, ['-version'], {encoding: 'utf8'}).split('\n')[0]
          }, null, 2));
          JS
          font="$(cat "$STUDIO_EVIDENCE/font-path.txt")"
          node make-synthetic-fixtures.mjs "$STUDIO_EVIDENCE/runtime.json" "$font" "$STUDIO_EVIDENCE/fixtures"
          for index in 1 2; do
            project="$STUDIO_EVIDENCE/fixtures/project-$index"
            node run.mjs validate "$project" --runtime "$STUDIO_EVIDENCE/runtime.json" 2>&1 | tee "$STUDIO_EVIDENCE/validate-$index.log"
            node run.mjs stills "$project" --runtime "$STUDIO_EVIDENCE/runtime.json" 2>&1 | tee "$STUDIO_EVIDENCE/stills-$index.log"
            node run.mjs render "$project" --runtime "$STUDIO_EVIDENCE/runtime.json" 2>&1 | tee "$STUDIO_EVIDENCE/render-$index.log"
            "$STUDIO_VENV/bin/python" qa.py "$project" --runtime "$STUDIO_EVIDENCE/runtime.json" 2>&1 | tee "$STUDIO_EVIDENCE/qa-$index.log"
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {hash} from './runtime.mjs';
          import {readRendererIdentity, createExportAcceptance} from './export-acceptance.mjs';
          const root = process.cwd(), out = process.env.STUDIO_EVIDENCE;
          const runtimeFile = path.join(out, 'runtime.json'), receipts = [];
          for (const index of [1, 2]) {
            const dir = path.join(out, 'fixtures', `project-${index}`);
            const project = JSON.parse(fs.readFileSync(path.join(dir, 'project.json')));
            const qa = JSON.parse(fs.readFileSync(path.join(dir, 'qa/final-verification.json')));
            const render = JSON.parse(fs.readFileSync(path.join(dir, 'render-receipt.json')));
            const projectHash = await hash(path.join(dir, 'project.json'));
            const {rendererHash} = await readRendererIdentity(root, path.join(dir, 'public/font.ttf'), project.profile);
            const acceptance = await createExportAcceptance({dir, root, projectHash, rendererHash, profile: project.profile, runtimeFile})();
            assert.deepEqual(acceptance, {ready: true, status: 'ACCEPTED'});
            assert.equal(project.id, `synthetic-${index}`);
            assert.equal(qa.status, 'PASS'); assert.equal(qa.fullDecode, 'PASS');
            assert.equal(qa.frames, 180); assert.equal(qa.durationSeconds, 6); assert.equal(qa.fps, 30);
            assert.deepEqual(qa.resolution, [360, 640]);
            assert.equal(qa.creativeApproval, 'PENDING');
            assert.equal(qa.acceptance, 'TECHNICAL_PASS_CREATIVE_REVIEW_REQUIRED');
            assert.equal(qa.sha256, await hash(path.join(dir, 'final.mp4')));
            assert.deepEqual(render.bindings, qa.bindings);
            receipts.push({projectId: project.id, acceptance, sha256: qa.sha256, bindings: qa.bindings});
          }
          fs.writeFileSync(path.join(out, 'acceptance.json'), JSON.stringify({status: 'PASS', projects: receipts}, null, 2));
          console.log('PASS: two generated Linux fixtures rendered, decoded, audio/picture checked and bound to current runtime');
          JS
          git diff --exit-code -- .

      - name: Preserve generated Studio Linux evidence
        if: always() && steps.candidate-diff.outputs.studio_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/*.tap
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/manifest-*.json
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/pattern.*
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/project-*/*.json
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/project-*/final.mp4
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/project-*/public/font.ttf
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/project-*/public/speech.wav
            ${{ runner.temp }}/studio-linux-${{ github.run_id }}-${{ github.run_attempt }}/fixtures/project-*/qa/**
          if-no-files-found: error
          retention-days: 7

      - name: Type-check frontend
        id: frontend-typecheck
        continue-on-error: true
        run: pnpm exec tsc -p apps/frontend/tsconfig.json --noEmit > frontend-typecheck.log 2>&1

      - name: Upload focused workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-set-diagnostics-${{ github.run_id }}
          path: |
            postiz-app/post-set-test.log
            postiz-app/frontend-typecheck.log
          if-no-files-found: error

      - name: Enforce frontend typecheck
        if: steps.frontend-typecheck.outcome == 'failure'
        run: |
          cat frontend-typecheck.log
          exit 1

      - name: Type-check backend
        run: pnpm exec tsc -p apps/backend/tsconfig.build.json --noEmit

      - name: Type-check orchestrator
        run: pnpm exec tsc -p apps/orchestrator/tsconfig.build.json --noEmit

      - name: Test Stripe billing activation boundary
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/stripe.billing-activation.spec.ts tests/copy-generation/stripe.entitlement-reconciliation.spec.ts

      - name: Test image credit billing boundary
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/media.service.image-credits.spec.ts

      - name: Test video media acquisition
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/video-media-file.spec.ts

      - name: Test video frame model processing
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/copy-generation.model.service.spec.ts

      - name: Test source brief grounding
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/source-brief.service.spec.ts

      - name: Test copy stream heartbeat
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/posts.controller.copy-heartbeat.spec.ts

      - name: Test real FFmpeg frame extraction
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand tests/copy-generation/video-frame-extraction.integration.spec.ts

      - name: Run copy-generation tests
        id: copy-generation-tests
        continue-on-error: true
        env:
          OAUTH_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/isolated
          EP_STUDIO_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/isolated
          LAUNCH_CHECKOUT_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/ep_ai_wallet_test
        run: |
          pnpm exec jest --config jest.copy-generation.config.cjs --runInBand --json --outputFile="$RUNNER_TEMP/billing-acceptance/copy.json" > copy-generation-test.log 2>&1
          python3 "$RUNNER_TEMP/billing-acceptance/check.py" jest "$RUNNER_TEMP/billing-acceptance/copy.json" copy

      - name: Upload copy-generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-generation-diagnostics-${{ github.run_id }}
          path: postiz-app/copy-generation-test.log
          if-no-files-found: error

      - name: Enforce copy-generation tests
        if: steps.copy-generation-tests.outcome == 'failure'
        run: |
          cat copy-generation-test.log
          exit 1

      - name: Run knowledge-base tests
        run: pnpm exec jest --config jest.knowledge-base.config.cjs --runInBand

      - name: Run published-posts tests
        env:
          EP_SUBMISSION_TEST_DATABASE_URL: postgresql://isolated:isolated@127.0.0.1:55462/isolated
        run: |
          set -euo pipefail
          pnpm exec jest --config jest.published-posts.config.cjs --runInBand --json --outputFile="$RUNNER_TEMP/billing-acceptance/published.json" 2>&1 | tee "$RUNNER_TEMP/billing-acceptance/published.log"
          python3 "$RUNNER_TEMP/billing-acceptance/check.py" jest "$RUNNER_TEMP/billing-acceptance/published.json" published

      - name: Test private connected Creator Audit
        run: pnpm exec jest --config jest.published-posts.config.cjs --testMatch '**/tests/creator-audit/**/*.spec.ts' --runInBand

      - name: Preserve billing acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/billing-acceptance
          if-no-files-found: error
          retention-days: 7

  classify-docker-build:
    name: Classify Docker build requirement
    needs: resolve-revisions
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Test Docker build classifier
        shell: bash
        run: bash scripts/test-classify-docker-build.sh

      - name: Test Docker build gate
        shell: bash
        run: bash scripts/test-check-pr-docker-gate.sh

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ needs.resolve-revisions.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-revisions.outputs.head_sha }}
        run: bash scripts/classify-docker-build.sh

  docker-validation:
    name: Docker validation
    needs:
      - resolve-revisions
      - repository-guard
      - classify-docker-build
    if: ${{ always() && needs.repository-guard.result == 'success' && needs.classify-docker-build.result == 'success' && needs.classify-docker-build.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./postiz-app
          file: ./postiz-app/Dockerfile.production
          target: verification
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pull-request-ci
          cache-to: type=gha,mode=max,scope=pull-request-ci

  docker-build:
    name: Docker build
    needs:
      - resolve-revisions
      - repository-guard
      - quality
      - classify-docker-build
      - docker-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.checkout_ref || 'main' }}

      - name: Verify prerequisites, classification, and Docker validation
        shell: bash
        env:
          RESOLUTION_RESULT: ${{ needs.resolve-revisions.result }}
          REPOSITORY_GUARD_RESULT: ${{ needs.repository-guard.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CLASSIFIER_RESULT: ${{ needs.classify-docker-build.result }}
          SHOULD_BUILD: ${{ needs.classify-docker-build.outputs.should_build }}
          DOCKER_VALIDATION_RESULT: ${{ needs.docker-validation.result }}
        run: |
          test "$RESOLUTION_RESULT" = success
          bash scripts/check-pr-docker-gate.sh

      - name: Report safe-only skip
        if: needs.classify-docker-build.outputs.should_build == 'false'
        run: echo "Docker image build skipped because every changed file is explicitly safe-only."
