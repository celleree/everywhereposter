name: Pull request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify canonical branch safeguards
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-canonical-branch.sh

  quality:
    name: Type checks and stable unit tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: postiz-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: postiz-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc -p apps/frontend/tsconfig.json --noEmit

      - name: Type-check backend
        run: pnpm exec tsc -p apps/backend/tsconfig.build.json --noEmit

      - name: Type-check orchestrator
        run: pnpm exec tsc -p apps/orchestrator/tsconfig.build.json --noEmit

      - name: Run copy-generation tests
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand

      - name: Run knowledge-base tests
        run: pnpm exec jest --config jest.knowledge-base.config.cjs --runInBand

      - name: Run published-posts tests
        run: pnpm exec jest --config jest.published-posts.config.cjs --runInBand

  classify-docker-build:
    name: Classify Docker build requirement
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual workflow dispatch always requires a Docker build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Missing pull-request base or head SHA; defaulting to Docker build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed files were detected; defaulting to Docker build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          should_build=false
          for file in "${changed_files[@]}"; do
            safe_only=false

            if [[ "$file" == "AGENTS.md" ]]; then
              safe_only=true
            elif [[ "$file" != */* && "$file" == *.md ]]; then
              safe_only=true
            elif [[ "$file" == docs/*.md ]]; then
              safe_only=true
            elif [[ "$file" == postiz-app/tests/* ]]; then
              safe_only=true
            elif [[ "$file" == postiz-app/libraries/react-shared-libraries/src/translation/locales/*.json ]]; then
              safe_only=true
            fi

            if [[ "$safe_only" == "true" ]]; then
              echo "SAFE-ONLY: $file"
            else
              echo "DOCKER REQUIRED: $file"
              should_build=true
            fi
          done

          if [[ "$should_build" == "true" ]]; then
            echo "At least one file is outside the safe-only allowlist; Docker build required."
          else
            echo "Every changed file is explicitly safe-only; Docker image build will be skipped."
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker build
    needs:
      - repository-guard
      - quality
      - classify-docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Report safe-only skip
        if: needs.classify-docker-build.outputs.should_build != 'true'
        run: echo "Docker image build skipped because every changed file is explicitly safe-only."

      - name: Check out repository
        if: needs.classify-docker-build.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.classify-docker-build.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        if: needs.classify-docker-build.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./postiz-app
          file: ./postiz-app/Dockerfile.dev
          platforms: linux/amd64
          push: false
          tags: publish-everywhere/postiz-app:ci-${{ github.sha }}
          cache-from: type=gha,scope=pull-request-ci
          cache-to: type=gha,mode=max,scope=pull-request-ci
