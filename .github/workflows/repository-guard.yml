name: Repository guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  canonical-branch:
    name: Canonical branch guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check sensitive logging guard
        run: node --test postiz-app/tests/security/sensitive-logging.guard.test.mjs

      - name: Verify canonical branch safeguards
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-canonical-branch.sh

  main-update-source:
    name: Main update came from a merged PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Reject force updates and direct pushes
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_WAS_FORCED: ${{ github.event.forced }}
        run: |
          set -eu

          if [ "$PUSH_WAS_FORCED" = "true" ]; then
            echo "ERROR: main was force-updated."
            exit 1
          fi

          MERGED_PR_COUNT="$(gh api             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"             --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"

          if [ "$MERGED_PR_COUNT" -lt 1 ]; then
            echo "ERROR: main was updated without a merged pull request."
            exit 1
          fi

          echo "main update is associated with a merged pull request."
