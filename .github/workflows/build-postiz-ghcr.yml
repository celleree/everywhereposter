name: Build EverywherePoster image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-postiz-ghcr.yml
      - postiz-app/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/celleree/publish-everywhere-postiz

jobs:
  source-gate:
    name: Production source gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify canonical branch safeguards
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check-canonical-branch.sh

      - name: Verify main update came from a merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_WAS_FORCED: ${{ github.event.forced }}
        run: |
          set -eu

          if [ "$PUSH_WAS_FORCED" = "true" ]; then
            echo "ERROR: main was force-updated."
            exit 1
          fi

          MERGED_PR_COUNT="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"

          if [ "$MERGED_PR_COUNT" -lt 1 ]; then
            echo "ERROR: main was updated without a merged pull request."
            exit 1
          fi

          echo "main update is associated with a merged pull request."

  quality:
    name: Type checks and stable unit tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: postiz-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: postiz-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc -p apps/frontend/tsconfig.json --noEmit

      - name: Type-check backend
        run: pnpm exec tsc -p apps/backend/tsconfig.build.json --noEmit

      - name: Type-check orchestrator
        run: pnpm exec tsc -p apps/orchestrator/tsconfig.build.json --noEmit

      - name: Run copy-generation tests
        run: pnpm exec jest --config jest.copy-generation.config.cjs --runInBand

      - name: Run knowledge-base tests
        run: pnpm exec jest --config jest.knowledge-base.config.cjs --runInBand

      - name: Run published-posts tests
        run: pnpm exec jest --config jest.published-posts.config.cjs --runInBand

  build:
    name: Build and publish image
    needs:
      - source-gate
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./postiz-app
          file: ./postiz-app/Dockerfile.production
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_GUIDED_COMPOSER_SHELL=${{ vars.NEXT_PUBLIC_GUIDED_COMPOSER_SHELL || 'false' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
