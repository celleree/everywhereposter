name: PR release coordinator

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited]
  push:
    branches: [main]
  workflow_run:
    workflows: [Pull request CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  report:
    if: >-
      github.repository == 'celleree/everywhereposter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'pull_request_target' ||
        github.event.pull_request.base.ref == 'main' ||
        github.event.changes.base.ref.from == 'main') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.workflow_id == 311062938 &&
         github.event.workflow_run.repository.id == 1196655943 &&
         github.event.workflow_run.path == '.github/workflows/pull-request-ci.yml' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.status == 'completed'))
    concurrency:
      group: pr-release-coordinator
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted main revision for this run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report on open pull requests targeting main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/pr-release-coordinator.py
