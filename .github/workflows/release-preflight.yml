name: Published app image preflight

on:
  pull_request:
    paths:
      - .github/workflows/release-preflight.yml
      - scripts/ci/verify-release-image.py
      - scripts/ci/test-release-image.py
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full main-branch app image SHA
        required: true
        type: string
      candidate_digest:
        description: Published sha256 image digest from the successful build
        required: true
        type: string
      previous_sha:
        description: Full source SHA of the current production image
        required: true
        type: string
      previous_image_id:
        description: Current production Docker sha256 image ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Release preflight safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B scripts/ci/test-release-image.py

  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
      PREVIOUS_SHA: ${{ inputs.previous_sha }}
      PREVIOUS_IMAGE_ID: ${{ inputs.previous_image_id }}
      IMAGE_REPOSITORY: ghcr.io/celleree/publish-everywhere-postiz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact release identities and successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          for key in ('CANDIDATE_SHA','PREVIOUS_SHA'):
              assert re.fullmatch(r'[a-f0-9]{40}',os.environ[key]), 'Invalid full SHA'
          for key in ('CANDIDATE_DIGEST','PREVIOUS_IMAGE_ID'):
              assert re.fullmatch(r'sha256:[a-f0-9]{64}',os.environ[key]), 'Invalid image digest'
          PY
          git merge-base --is-ancestor "$PREVIOUS_SHA" "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git diff --quiet "$CANDIDATE_SHA..origin/main" -- postiz-app .github/workflows/build-postiz-ghcr.yml
          for sha in "$CANDIDATE_SHA" "$PREVIOUS_SHA"; do
            gh api --paginate --slurp -X GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-postiz-ghcr.yml/runs" \
              -f branch=main -f event=push -f status=success -f head_sha="$sha" -f per_page=100 |
              jq -e --arg sha "$sha" 'any(.[] | .workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")' >/dev/null
          done

      - name: Pull exact existing images with temporary runner authorization
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-preflight-auth
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE_REPOSITORY:$CANDIDATE_SHA"
          docker pull "$IMAGE_REPOSITORY:$PREVIOUS_SHA"
          docker pull postgres:17-alpine

      - name: Remove registry authentication before image execution
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-preflight-auth
        run: |
          set -euo pipefail
          test "$DOCKER_CONFIG" = "$RUNNER_TEMP/release-preflight-auth"
          rm -rf -- "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG"

      - name: Rehearse migrations and legacy reads with synthetic records only
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-preflight-auth
        run: |
          python3 -B scripts/ci/verify-release-image.py \
            --candidate-sha "$CANDIDATE_SHA" --candidate-digest "$CANDIDATE_DIGEST" \
            --previous-sha "$PREVIOUS_SHA" --previous-id "$PREVIOUS_IMAGE_ID" \
            --auth-directory "$DOCKER_CONFIG" --receipt "$RUNNER_TEMP/release-preflight-receipt.json" \
            --state "$RUNNER_TEMP/release-preflight-state.json"

      - name: Record allowlisted readiness receipt
        run: |
          {
            echo 'Published-image migration preflight passed. No production connection or change.'
            cat "$RUNNER_TEMP/release-preflight-receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean only journaled owned resources and temporary authentication
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-preflight-auth
        run: |
          set -euo pipefail
          test "$DOCKER_CONFIG" = "$RUNNER_TEMP/release-preflight-auth"
          rm -rf -- "$DOCKER_CONFIG"
          if [ -f "$RUNNER_TEMP/release-preflight-state.json" ]; then
            python3 -B scripts/ci/verify-release-image.py --cleanup "$RUNNER_TEMP/release-preflight-state.json"
          fi
