name: Codex development agents

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [ready_for_review, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: Agent role to run
        required: true
        type: choice
        options: [plan, implement, review, repair, memory, preflight]
      number:
        description: Issue or pull request number (PR for preflight)
        required: true
        type: string

concurrency:
  group: codex-agent-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight' && '-preflight' || '' }}
  cancel-in-progress: false

permissions: {}

jobs:
  read-role:
    if: >-
      github.repository == 'celleree/everywhereposter' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (
        github.event.repository.private == true ||
        (github.event_name == 'pull_request_target' && github.event.action == 'ready_for_review') ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'review' || (inputs.mode == 'preflight' && github.ref == 'refs/heads/main')))
      ) &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
        (github.event_name == 'pull_request_target' && github.event.action == 'ready_for_review') ||
        (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'plan' || inputs.mode == 'review' || inputs.mode == 'memory' || (inputs.mode == 'preflight' && github.ref == 'refs/heads/main'))
        )
      )
    runs-on: [self-hosted, linux, codex]
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Check private recovery before checkout
        shell: bash
        run: |
          node <<'NODE'
          // RECOVERY_PRECHECK_BEGIN
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          try {
            const store = process.env.CODEX_RECOVERY_ROOT;
            const inside = (value, root) => value === root || value.startsWith(root + '/');
            const entry = (value, directory) => {
              const info = fs.lstatSync(value);
              if (info.isSymbolicLink() || info.uid !== process.getuid() || (info.mode & 0o777) !== (directory ? 0o700 : 0o600) ||
                  (directory ? !info.isDirectory() : !info.isFile() || info.nlink !== 1)) throw Error();
            };
            if (!store || !path.isAbsolute(store) || path.resolve(store) !== store || store === os.homedir() ||
                store.split('/').some(part => ['.ssh', '.gnupg', '.aws'].includes(part))) throw Error();
            let current = '/';
            for (const part of store.split('/').filter(Boolean)) {
              current = path.join(current, part);
              if (fs.lstatSync(current).isSymbolicLink()) throw Error();
              if (fs.existsSync(path.join(current, '.git'))) throw Error();
            }
            entry(store, true);
            const roots = [process.env.GITHUB_WORKSPACE, process.env.RUNNER_WORKSPACE, process.env.RUNNER_TEMP, process.env.TMPDIR, '/tmp', '/var/tmp'].filter(Boolean).map(value => path.resolve(value));
            if (roots.some(root => inside(store, root)) || process.env.GITHUB_WORKSPACE && inside(path.resolve(process.env.GITHUB_WORKSPACE), store)) throw Error();
            const names = fs.readdirSync(store);
            if (names.some(name => !['store.json', 'records', 'ACTIVE'].includes(name)) || names.includes('ACTIVE')) throw Error();
            if (names.length) {
              const formatPath = path.join(store, 'store.json');
              entry(formatPath, false);
              if (fs.statSync(formatPath).size > 512 * 1024) throw Error();
              const format = JSON.parse(fs.readFileSync(formatPath, 'utf8'));
              if (format.version !== 1 || format.kind !== 'everywhereposter-task-recovery') throw Error();
            }
            if (names.includes('records')) {
              const records = path.join(store, 'records');
              entry(records, true);
              const ids = fs.readdirSync(records);
              if (ids.length >= 100) throw Error();
              for (const id of ids) {
                if (!/^[a-zA-Z0-9-]{1,100}$/.test(id)) throw Error();
                entry(path.join(records, id), true);
              }
            }
            console.log('Recovery quarantine check passed; runner readiness is checked separately.');
          } catch {
            console.error('ERROR: Private recovery is unavailable or quarantined; checkout is blocked.');
            process.exitCode = 1;
          }
          // RECOVERY_PRECHECK_END
          NODE

      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check opt-in release readiness
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/release-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          PREFLIGHT_PR: ${{ inputs.number }}
        run: bash scripts/agents/check-release-readiness.sh runner "$PREFLIGHT_PR"

      - name: Resolve read-only role and target
        if: inputs.mode != 'preflight'
        id: task
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "number=${{ inputs.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "mode=plan" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.action }}" == "ready_for_review" ]]; then
            echo "mode=review" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=memory" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify trusted runner tools
        if: inputs.mode != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: |
          rm -rf "$GH_CONFIG_DIR"
          mkdir -p "$GH_CONFIG_DIR"
          codex login status
          codex --version
          gh --version
          git --version
          jq --version
          command -v base64
          bwrap --version

      - name: Run bounded Codex role
        if: inputs.mode != 'preflight'
        env:
          CODEX_TASK_MODEL: ${{ vars.CODEX_AGENT_MODEL }}
          CODEX_TASK_REASONING_EFFORT: ${{ vars.CODEX_AGENT_REASONING_EFFORT }}
          CODEX_TASK_SETTINGS_SOURCE: github-actions-vars
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: sh scripts/agents/codex-task.sh "${{ steps.task.outputs.mode }}" "${{ steps.task.outputs.number }}"

  write-role:
    if: >-
      github.repository == 'celleree/everywhereposter' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == true &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'implement' || inputs.mode == 'repair')
    runs-on: [self-hosted, linux, codex]
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    env:
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Check private recovery before checkout
        shell: bash
        run: |
          node <<'NODE'
          // RECOVERY_PRECHECK_BEGIN
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          try {
            const store = process.env.CODEX_RECOVERY_ROOT;
            const inside = (value, root) => value === root || value.startsWith(root + '/');
            const entry = (value, directory) => {
              const info = fs.lstatSync(value);
              if (info.isSymbolicLink() || info.uid !== process.getuid() || (info.mode & 0o777) !== (directory ? 0o700 : 0o600) ||
                  (directory ? !info.isDirectory() : !info.isFile() || info.nlink !== 1)) throw Error();
            };
            if (!store || !path.isAbsolute(store) || path.resolve(store) !== store || store === os.homedir() ||
                store.split('/').some(part => ['.ssh', '.gnupg', '.aws'].includes(part))) throw Error();
            let current = '/';
            for (const part of store.split('/').filter(Boolean)) {
              current = path.join(current, part);
              if (fs.lstatSync(current).isSymbolicLink()) throw Error();
              if (fs.existsSync(path.join(current, '.git'))) throw Error();
            }
            entry(store, true);
            const roots = [process.env.GITHUB_WORKSPACE, process.env.RUNNER_WORKSPACE, process.env.RUNNER_TEMP, process.env.TMPDIR, '/tmp', '/var/tmp'].filter(Boolean).map(value => path.resolve(value));
            if (roots.some(root => inside(store, root)) || process.env.GITHUB_WORKSPACE && inside(path.resolve(process.env.GITHUB_WORKSPACE), store)) throw Error();
            const names = fs.readdirSync(store);
            if (names.some(name => !['store.json', 'records', 'ACTIVE'].includes(name)) || names.includes('ACTIVE')) throw Error();
            if (names.length) {
              const formatPath = path.join(store, 'store.json');
              entry(formatPath, false);
              if (fs.statSync(formatPath).size > 512 * 1024) throw Error();
              const format = JSON.parse(fs.readFileSync(formatPath, 'utf8'));
              if (format.version !== 1 || format.kind !== 'everywhereposter-task-recovery') throw Error();
            }
            if (names.includes('records')) {
              const records = path.join(store, 'records');
              entry(records, true);
              const ids = fs.readdirSync(records);
              if (ids.length >= 100) throw Error();
              for (const id of ids) {
                if (!/^[a-zA-Z0-9-]{1,100}$/.test(id)) throw Error();
                entry(path.join(records, id), true);
              }
            }
            console.log('Recovery quarantine check passed; runner readiness is checked separately.');
          } catch {
            console.error('ERROR: Private recovery is unavailable or quarantined; checkout is blocked.');
            process.exitCode = 1;
          }
          // RECOVERY_PRECHECK_END
          NODE

      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted runner tools
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: |
          rm -rf "$GH_CONFIG_DIR"
          mkdir -p "$GH_CONFIG_DIR"
          codex login status
          codex --version
          gh --version
          git --version
          jq --version
          command -v base64
          bwrap --version

      - name: Run bounded Codex role
        env:
          CODEX_TASK_MODEL: ${{ vars.CODEX_AGENT_MODEL }}
          CODEX_TASK_REASONING_EFFORT: ${{ vars.CODEX_AGENT_REASONING_EFFORT }}
          CODEX_TASK_SETTINGS_SOURCE: github-actions-vars
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: sh scripts/agents/codex-task.sh "${{ inputs.mode }}" "${{ inputs.number }}"
