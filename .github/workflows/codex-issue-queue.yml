name: Codex unattended issue queue
run-name: Codex unattended queue - ${{ inputs.issues }}

on:
  workflow_dispatch:
    inputs:
      issues:
        description: Comma-separated open issue numbers
        required: true
        type: string
        default: "30,27,28,15,16,17,18"
      implement_issues:
        description: Ready, safe issue numbers eligible for draft-PR implementation
        required: false
        type: string
        default: ""
      max_minutes_per_role:
        description: Maximum runtime for each Codex plan or implementation role
        required: true
        type: choice
        options:
          - "60"
          - "120"
          - "150"
        default: "120"
      confirmation:
        description: Type RUN UNATTENDED to start
        required: true
        type: string

concurrency:
  group: codex-unattended-issue-queue
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirmation == 'RUN UNATTENDED' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Normalize issue list and remove duplicates
        id: queue
        env:
          QUEUE_ISSUES: ${{ inputs.issues }}
          QUEUE_IMPLEMENT_ISSUES: ${{ inputs.implement_issues }}
        run: |
          matrix=$(bash scripts/agents/codex-issue-queue.sh prepare)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  issue:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    strategy:
      # Matrix data preserves first-occurrence order, but GitHub controls pending
      # job selection. Entries must be independent of runtime start order.
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: [self-hosted, linux, codex]
    # Two 150-minute roles plus their kill grace leave at least 30 minutes for
    # checkout, cleanup, status comments, and final reporting.
    timeout-minutes: 340
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GIT_TERMINAL_PROMPT: "0"
      QUEUE_ISSUE: ${{ matrix.issue }}
      QUEUE_IMPLEMENT: ${{ matrix.implement }}
      QUEUE_MAX_MINUTES: ${{ inputs.max_minutes_per_role }}

    steps:
      - name: Check private recovery before checkout
        shell: bash
        run: |
          node <<'NODE'
          // RECOVERY_PRECHECK_BEGIN
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          try {
            const store = process.env.CODEX_RECOVERY_ROOT;
            const inside = (value, root) => value === root || value.startsWith(root + '/');
            const entry = (value, directory) => {
              const info = fs.lstatSync(value);
              if (info.isSymbolicLink() || info.uid !== process.getuid() || (info.mode & 0o777) !== (directory ? 0o700 : 0o600) ||
                  (directory ? !info.isDirectory() : !info.isFile() || info.nlink !== 1)) throw Error();
            };
            if (!store || !path.isAbsolute(store) || path.resolve(store) !== store || store === os.homedir() ||
                store.split('/').some(part => ['.ssh', '.gnupg', '.aws'].includes(part))) throw Error();
            let current = '/';
            for (const part of store.split('/').filter(Boolean)) {
              current = path.join(current, part);
              if (fs.lstatSync(current).isSymbolicLink()) throw Error();
              if (fs.existsSync(path.join(current, '.git'))) throw Error();
            }
            entry(store, true);
            const roots = [process.env.GITHUB_WORKSPACE, process.env.RUNNER_WORKSPACE, process.env.RUNNER_TEMP, process.env.TMPDIR, '/tmp', '/var/tmp'].filter(Boolean).map(value => path.resolve(value));
            if (roots.some(root => inside(store, root)) || process.env.GITHUB_WORKSPACE && inside(path.resolve(process.env.GITHUB_WORKSPACE), store)) throw Error();
            const names = fs.readdirSync(store);
            if (names.some(name => !['store.json', 'records', 'ACTIVE'].includes(name)) || names.includes('ACTIVE')) throw Error();
            if (names.length) {
              const formatPath = path.join(store, 'store.json');
              entry(formatPath, false);
              if (fs.statSync(formatPath).size > 512 * 1024) throw Error();
              const format = JSON.parse(fs.readFileSync(formatPath, 'utf8'));
              if (format.version !== 1 || format.kind !== 'everywhereposter-task-recovery') throw Error();
            }
            if (names.includes('records')) {
              const records = path.join(store, 'records');
              entry(records, true);
              const ids = fs.readdirSync(records);
              if (ids.length >= 100) throw Error();
              for (const id of ids) {
                if (!/^[a-zA-Z0-9-]{1,100}$/.test(id)) throw Error();
                entry(path.join(records, id), true);
              }
            }
            console.log('Recovery quarantine check passed; runner readiness is checked separately.');
          } catch {
            console.error('ERROR: Private recovery is unavailable or quarantined; checkout is blocked.');
            process.exitCode = 1;
          }
          // RECOVERY_PRECHECK_END
          NODE

      - name: Check out the reviewed main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted runner tools
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: |
          rm -rf "$GH_CONFIG_DIR"
          mkdir -p "$GH_CONFIG_DIR"
          codex login status
          codex --version
          gh --version
          git --version
          jq --version
          timeout --version | head -n 1
          bwrap --version

      - name: Process issue with isolated role timeouts
        env:
          CODEX_TASK_MODEL: ${{ vars.CODEX_AGENT_MODEL }}
          CODEX_TASK_REASONING_EFFORT: ${{ vars.CODEX_AGENT_REASONING_EFFORT }}
          CODEX_TASK_SETTINGS_SOURCE: github-actions-vars
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/publish-everywhere-gh-empty
        run: bash scripts/agents/codex-issue-queue.sh run
