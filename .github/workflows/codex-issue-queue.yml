name: Codex unattended issue queue
run-name: Codex unattended queue - ${{ inputs.issues }}

on:
  workflow_dispatch:
    inputs:
      issues:
        description: Comma-separated open issue numbers to process sequentially
        required: true
        type: string
        default: "30,27,28,15,16,17,18"
      implement_issues:
        description: Pre-approved safe issues eligible for draft-PR implementation
        required: true
        type: string