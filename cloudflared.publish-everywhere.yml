# This tunnel exposes the local Docker stack publicly. Start it only with the
# public-tunnel Compose profile after confirming the DB and domain are intended.
tunnel: c9487391-ac63-4934-b29d-06b1a1fd3801
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: app.everywhereposter.com
    service: http://public-web:80
  - hostname: publisheverywhere.halowebsites.com
    service: http://public-web:80
  - service: http_status:404
