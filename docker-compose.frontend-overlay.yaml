services:
  postiz-frontend:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-frontend
    restart: unless-stopped
    command: ["/bin/sh", "-lc", "cd /app/apps/frontend && pnpm start"]
    environment:
      MAIN_URL: '${POSTIZ_FRONTEND_URL:-http://localhost:4200}'
      FRONTEND_URL: '${POSTIZ_FRONTEND_URL:-http://localhost:4200}'
      NEXT_PUBLIC_BACKEND_URL: '${POSTIZ_FRONTEND_URL:-http://localhost:4200}/api'
      MCP_URL: '${POSTIZ_FRONTEND_URL:-http://localhost:4200}'
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      STORAGE_PROVIDER: 'local'
    depends_on:
      postiz:
        condition: service_started
    networks:
      - postiz-network

  postiz-frontend-web:
    image: nginx:1.27-alpine
    container_name: postiz-frontend-web
    restart: unless-stopped
    depends_on:
      postiz-frontend:
        condition: service_started
      postiz:
        condition: service_started
    volumes:
      - ./nginx/postiz-frontend-standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site/privacy-policy.html:/usr/share/nginx/html/privacy-policy.html:ro
      - ./site/terms-of-service.html:/usr/share/nginx/html/terms-of-service.html:ro
      - ./site/data-deletion.html:/usr/share/nginx/html/data-deletion.html:ro
      - ./site/branding:/usr/share/nginx/html/branding:ro
    ports:
      - "4200:80"
    networks:
      - postiz-network
